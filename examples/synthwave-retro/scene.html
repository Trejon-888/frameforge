<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>kino · synthwave-retro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;700&display=block" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0D0015;
    }

    .scene {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* ── Sky (upper half) ── */
    .sky {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1080px;
      background: linear-gradient(
        to bottom,
        #0D0015 0%,
        #1a0035 18%,
        #3D0060 38%,
        #8B0057 62%,
        #CC3A35 82%,
        #FF8B35 94%,
        #FFD700 100%
      );
      z-index: 0;
    }

    /* ── Stars ── */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 700px;
      z-index: 1;
      /* CSS box-shadow cluster stars */
    }
    .stars::before {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      background: #FFF;
      border-radius: 50%;
      box-shadow:
        80px 60px 0 rgba(255,255,255,0.8),
        180px 40px 0 rgba(255,255,255,0.6),
        280px 90px 0 rgba(255,255,255,0.9),
        380px 55px 0 rgba(255,255,255,0.5),
        480px 75px 0 rgba(255,255,255,0.8),
        560px 30px 0 rgba(255,255,255,0.7),
        650px 85px 0 rgba(255,255,255,0.9),
        740px 45px 0 rgba(255,255,255,0.6),
        840px 70px 0 rgba(255,255,255,0.8),
        920px 35px 0 rgba(255,255,255,0.7),
        1000px 80px 0 rgba(255,255,255,0.5),
        120px 130px 0 rgba(255,255,255,0.4),
        230px 160px 0 rgba(255,255,255,0.7),
        345px 140px 0 rgba(255,255,255,0.6),
        455px 120px 0 rgba(255,255,255,0.8),
        555px 155px 0 rgba(255,255,255,0.5),
        675px 135px 0 rgba(255,255,255,0.7),
        775px 145px 0 rgba(255,255,255,0.4),
        875px 125px 0 rgba(255,255,255,0.9),
        975px 165px 0 rgba(255,255,255,0.6),
        50px 200px 0 rgba(255,255,255,0.5),
        160px 220px 0 rgba(255,255,255,0.7),
        300px 210px 0 rgba(255,255,255,0.4),
        420px 240px 0 rgba(255,255,255,0.8),
        530px 195px 0 rgba(255,255,255,0.6),
        640px 225px 0 rgba(255,255,255,0.5),
        760px 205px 0 rgba(255,255,255,0.7),
        890px 230px 0 rgba(255,255,255,0.4),
        990px 215px 0 rgba(255,255,255,0.8);
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    /* ── Grid floor ── */
    .grid-wrap {
      position: absolute;
      bottom: 0;
      left: -200px;
      right: -200px;
      height: 900px;
      transform: perspective(500px) rotateX(55deg);
      transform-origin: top center;
      z-index: 2;
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,45,120,0.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,45,120,0.55) 1px, transparent 1px);
      background-size: 100px 100px;
      animation: grid-scroll 3s linear infinite;
    }
    @keyframes grid-scroll {
      from { background-position: 0 0; }
      to   { background-position: 0 100px; }
    }
    /* Fade grid to transparent at edges */
    .grid-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(13,0,21,0.0) 0%,
        rgba(13,0,21,0.0) 70%,
        rgba(13,0,21,0.85) 100%
      );
      z-index: 3;
      pointer-events: none;
    }

    /* ── Horizon line + pulse ── */
    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 1080px;
      height: 5px;
      background: linear-gradient(90deg,
        transparent 0%,
        #FF6B35 15%,
        #FFD700 50%,
        #FF6B35 85%,
        transparent 100%);
      box-shadow:
        0 0 30px 8px rgba(255,107,53,0.7),
        0 0 80px 20px rgba(255,107,53,0.35);
      z-index: 5;
      animation: horizon-pulse 3s ease-in-out infinite;
    }
    @keyframes horizon-pulse {
      0%, 100% { filter: brightness(0.85); }
      50%       { filter: brightness(1.2); }
    }

    /* ── Scanlines ── */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.28) 2px,
        rgba(0,0,0,0.28) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── CRT vignette ── */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 99;
    }

    /* ── Main title ── */
    .title-wrap {
      position: absolute;
      top: 440px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }
    .title-eyebrow {
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #00F5FF;
      margin-bottom: 22px;
      opacity: 0;
    }
    .title-main {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 195px;
      line-height: 0.85;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      /* Chrome gradient text */
      background: linear-gradient(180deg,
        #FFFFFF 0%,
        #00F5FF 28%,
        #9B00FF 58%,
        #FF2D78 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      /* Chromatic aberration */
      filter: drop-shadow(3px 0 0 rgba(255,45,120,0.6)) drop-shadow(-3px 0 0 rgba(0,245,255,0.6));
      opacity: 0;
      display: block;
    }
    .title-sub {
      font-family: 'Exo 2', sans-serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(0,245,255,0.75);
      margin-top: 24px;
      opacity: 0;
    }

    /* Flicker animation */
    @keyframes flicker {
      0%   { opacity: 0; }
      8%   { opacity: 0.9; }
      12%  { opacity: 0.3; }
      20%  { opacity: 1; }
      28%  { opacity: 0.7; }
      36%  { opacity: 1; }
      100% { opacity: 1; }
    }
    .flicker-in {
      animation: flicker 0.55s ease-out forwards;
    }

    /* ── Feature cards (float above grid) ── */
    .cards-wrap {
      position: absolute;
      bottom: 200px;
      left: 0;
      right: 0;
      padding: 0 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }
    .neon-card {
      background: rgba(13,0,21,0.82);
      border: 1px solid rgba(255,45,120,0.55);
      box-shadow:
        0 0 18px rgba(255,45,120,0.35),
        inset 0 0 18px rgba(255,45,120,0.06);
      padding: 30px 36px;
      display: flex;
      align-items: center;
      gap: 28px;
      opacity: 0;
      transform: translateY(70px);
    }
    .card-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: rgba(255,45,120,0.65);
      min-width: 40px;
    }
    .card-info { flex: 1; }
    .card-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 5px;
    }
    .card-desc {
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(0,245,255,0.55);
    }
    .card-dot {
      width: 10px;
      height: 10px;
      background: #FF2D78;
      border-radius: 50%;
      box-shadow: 0 0 10px 3px rgba(255,45,120,0.6);
      animation: dot-pulse 1.8s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── End overlay ── */
    .end-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D0015;
      opacity: 0;
      pointer-events: none;
    }
    .end-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 180px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 3px #FF2D78;
      filter: drop-shadow(0 0 18px rgba(255,45,120,0.8));
      opacity: 0;
    }
    .end-rule {
      width: 600px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FF2D78, #00F5FF, transparent);
      margin: 32px 0 24px;
      box-shadow: 0 0 16px rgba(255,45,120,0.5);
      transform: scaleX(0);
      transform-origin: left;
    }
    .end-handle {
      font-family: 'Exo 2', sans-serif;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #00F5FF;
      text-shadow: 0 0 20px rgba(0,245,255,0.7);
      opacity: 0;
    }
  </style>
</head>

<body>
<div class="scene">

  <!-- Atmosphere -->
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="horizon"></div>

  <!-- Grid floor -->
  <div class="grid-wrap">
    <div class="grid"></div>
  </div>

  <!-- Overlays -->
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Main title -->
  <div class="title-wrap" id="title-wrap">
    <div class="title-eyebrow" id="title-eyebrow">TRANSMISSION // KINO.RENDER</div>
    <span class="title-main" id="title-main">KINO</span>
    <div class="title-sub" id="title-sub">FRAME-PERFECT VIDEO FROM ANY BROWSER</div>
  </div>

  <!-- Feature cards -->
  <div class="cards-wrap" id="cards-wrap">
    <div class="neon-card" id="card-1">
      <span class="card-num">01</span>
      <div class="card-info">
        <div class="card-name">HTML + CSS</div>
        <div class="card-desc">Any web layout · Any animation</div>
      </div>
      <div class="card-dot"></div>
    </div>
    <div class="neon-card" id="card-2">
      <span class="card-num">02</span>
      <div class="card-info">
        <div class="card-name">WEBGL · THREE.JS</div>
        <div class="card-desc">Shaders · 3D scenes · GPU rendered</div>
      </div>
      <div class="card-dot"></div>
    </div>
    <div class="neon-card" id="card-3">
      <span class="card-num">03</span>
      <div class="card-info">
        <div class="card-name">PYTHON SDK</div>
        <div class="card-desc">Script → scene in one command</div>
      </div>
      <div class="card-dot"></div>
    </div>
  </div>

  <!-- End overlay -->
  <div class="end-overlay" id="end">
    <div class="end-title" id="end-title">KINO</div>
    <div class="end-rule" id="end-rule"></div>
    <div class="end-handle" id="end-handle">@KINOHQ</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const ease   = 'power3.out';
  const easeSm = 'power2.out';

  const tl = gsap.timeline({ defaults: { ease } });
  tl

  // ── S1: Title flicker-in (0 – 5s) ──
  .add('s1', 0)
  .call(() => {
    document.getElementById('title-eyebrow').classList.add('flicker-in');
  }, null, 's1+=0.3')
  .set('#title-eyebrow', { opacity: 1 }, 's1+=0.86')
  .call(() => {
    document.getElementById('title-main').classList.add('flicker-in');
  }, null, 's1+=1.0')
  .set('#title-main', { opacity: 1 }, 's1+=1.56')
  .fromTo('#title-sub',
    { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.6, ease: easeSm },
  's1+=1.7')

  // ── S2: Cards slide up from grid (5 – 13s) ──
  .add('s2', 5.0)
  .fromTo('#card-1',
    { opacity: 0, y: 70 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.2)' },
  's2')
  .fromTo('#card-2',
    { opacity: 0, y: 70 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.2)' },
  's2+=0.2')
  .fromTo('#card-3',
    { opacity: 0, y: 70 },
    { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.2)' },
  's2+=0.4')

  // ── Hold peak (5 – 17s) ──

  // ── S3: End overlay (17 – 22s) ──
  .add('s3', 17.0)
  .to('#end', { opacity: 1, duration: 0.6, ease: 'none' }, 's3')
  .call(() => {
    document.getElementById('end-title').classList.add('flicker-in');
  }, null, 's3+=0.5')
  .set('#end-title', { opacity: 1 }, 's3+=1.07')
  .fromTo('#end-rule',
    { scaleX: 0 },
    { scaleX: 1, duration: 0.65, ease: 'power2.inOut' },
  's3+=1.1')
  .fromTo('#end-handle',
    { opacity: 0, y: 8 },
    { opacity: 1, y: 0, duration: 0.45 },
  's3+=1.8');
</script>
</body>
</html>
