<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>kino · neon velocity</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;800&family=Geist+Mono:wght@400;500;600&display=block" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #050505;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .scene {
      position: relative;
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 90px;
    }

    /* ── Grain ── */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.028;
    }

    /* ── Refraction glow ── */
    .glow-orb {
      position: absolute;
      width: 1000px;
      height: 1000px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -54%);
      background: radial-gradient(circle, rgba(191,255,0,0.11) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
    }

    /* ── KINO stamp ── */
    .kino-stamp {
      position: relative;
      z-index: 10;
      text-align: left;
      width: 100%;
      opacity: 0;
      margin-bottom: 6px;
    }
    .kino-word {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 226px;
      line-height: 0.82;
      letter-spacing: -0.05em;
      color: #BFFF00;
      text-transform: uppercase;
      display: block;
    }

    /* ── Production tag ── */
    .prod-tag {
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      text-align: left;
      width: 100%;
      z-index: 10;
      position: relative;
      opacity: 0;
      margin-bottom: 60px;
    }

    /* ── Glass card ── */
    .glass-card {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 52px 60px 56px;
      background: rgba(255,255,255,0.028);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.07);
      border-top: 1px solid rgba(255,255,255,0.14);
      border-radius: 0;
      box-shadow:
        0 0 100px rgba(191,255,0,0.055),
        inset 0 1px 0 rgba(255,255,255,0.08);
      opacity: 0;
    }

    .card-eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #BFFF00;
      margin-bottom: 26px;
      opacity: 0;
    }

    .card-headline {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 82px;
      line-height: 0.88;
      letter-spacing: -0.045em;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0;
    }
    .card-headline em {
      color: #BFFF00;
      font-style: normal;
    }

    .card-body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      font-size: 21px;
      line-height: 1.6;
      color: rgba(255,255,255,0.4);
      letter-spacing: -0.01em;
      opacity: 0;
    }

    /* ── Divider ── */
    .card-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(191,255,0,0.45), rgba(191,255,0,0.1), transparent);
      margin: 36px 0 32px;
      transform: scaleX(0);
      transform-origin: left;
      opacity: 0;
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 0;
      opacity: 0;
    }
    .stat {
      flex: 1;
      padding: 24px 0 20px;
      border: 1px solid rgba(255,255,255,0.07);
      border-right: none;
      text-align: center;
    }
    .stat:last-child { border-right: 1px solid rgba(255,255,255,0.07); }

    .stat-value {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.04em;
      color: #BFFF00;
      font-variant-numeric: tabular-nums;
      display: block;
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-label {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    /* ── Laser button ── */
    .laser-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #BFFF00;
      color: #000000;
      font-family: 'Geist Mono', monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 26px 40px;
      border-radius: 9999px;
      box-shadow: 0 0 28px rgba(191,255,0,0.28);
      position: relative;
      overflow: hidden;
      opacity: 0;
      margin-top: 28px;
    }
    .laser-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
        transparent 25%,
        rgba(255,255,255,0.72) 50%,
        transparent 75%);
      transform: translateX(-130%);
    }

    /* ── End card ── */
    .end-card {
      position: absolute;
      inset: 0;
      background: #BFFF00;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }
    .end-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 300px;
      line-height: 0.8;
      letter-spacing: -0.055em;
      color: #000000;
      text-transform: uppercase;
    }
    .end-rule {
      width: 660px;
      height: 4px;
      background: #000000;
      margin: 40px 0 30px;
      transform: scaleX(0);
      transform-origin: left;
    }
    .end-handle {
      font-family: 'Geist Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.32em;
      color: #000000;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
<div class="scene">
  <canvas id="grain" width="1080" height="1920"></canvas>
  <div class="glow-orb" id="glow"></div>

  <!-- KINO stamp -->
  <div class="kino-stamp" id="stamp">
    <span class="kino-word">KINO</span>
  </div>

  <!-- Production tag -->
  <div class="prod-tag" id="prod-tag">AN INFINITX PRODUCTION</div>

  <!-- Glass hero card -->
  <div class="glass-card" id="card">
    <div class="card-eyebrow" id="eyebrow">01 / RENDER ENGINE</div>
    <div class="card-headline" id="headline">FRAME-<br>PERFECT.<br><em>ANY</em><br>BROWSER.</div>
    <div class="card-body" id="body">
      HTML · Canvas · WebGL · Three.js<br>
      GSAP · Python · CSS — all deterministic.
    </div>
    <div class="card-divider" id="divider"></div>
    <div class="stats" id="stats">
      <div class="stat">
        <span class="stat-value" id="stat-fps">0</span>
        <span class="stat-label">FPS</span>
      </div>
      <div class="stat">
        <span class="stat-value">∞</span>
        <span class="stat-label">FRAMEWORKS</span>
      </div>
      <div class="stat">
        <span class="stat-value">1</span>
        <span class="stat-label">COMMAND</span>
      </div>
    </div>
    <div class="laser-btn" id="laser">
      <span>npx kino render</span>
      <div class="laser-sweep" id="sweep"></div>
    </div>
  </div>

  <!-- End card -->
  <div class="end-card" id="end">
    <div class="end-title">KINO</div>
    <div class="end-rule" id="end-rule"></div>
    <div class="end-handle">@kinohq</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // ── Grain ──
  const grainCtx = document.getElementById('grain').getContext('2d');
  let tick = 0;
  function drawGrain() {
    const img = grainCtx.createImageData(270, 480);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    grainCtx.save(); grainCtx.scale(4, 4);
    grainCtx.putImageData(img, 0, 0); grainCtx.restore();
  }
  gsap.ticker.add(() => { if (++tick % 3 === 0) drawGrain(); });

  // ── Counter ──
  function countUp(el, target, dur) {
    const obj = { v: 0 };
    gsap.to(obj, { v: target, duration: dur, ease: 'power2.out',
      onUpdate() { el.textContent = Math.round(obj.v); }
    });
  }

  const ease   = 'power3.out';
  const easeSm = 'power2.out';

  const tl = gsap.timeline({ defaults: { ease } });
  tl

  // ── S1: KINO stamp (0 – 2.8s) ──
  .add('s1', 0)
  .fromTo('#stamp',
    { opacity: 0, scale: 1.28, transformOrigin: 'left center' },
    { opacity: 1, scale: 1, duration: 0.24, ease: 'power4.out' },
  's1')
  .to('#glow', { opacity: 1, duration: 1.8, ease: 'power1.inOut' }, 's1+=0.05')
  .fromTo('#prod-tag',
    { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.5, ease: easeSm },
  's1+=0.28')

  // ── S2: Card entrance (2.8 – 7s) ──
  .add('s2', 2.8)
  .fromTo('#card',
    { opacity: 0, y: 40, rotateX: 10, transformPerspective: 1200 },
    { opacity: 1, y: 0, rotateX: 0, duration: 0.95, ease: 'back.out(1.2)' },
  's2')
  .fromTo('#eyebrow',
    { opacity: 0, y: -10 },
    { opacity: 1, y: 0, duration: 0.5, ease: easeSm },
  's2+=0.55')
  .fromTo('#headline',
    { opacity: 0, y: 22 },
    { opacity: 1, y: 0, duration: 0.7 },
  's2+=0.9')
  .fromTo('#body',
    { opacity: 0, y: 14 },
    { opacity: 1, y: 0, duration: 0.55, ease: easeSm },
  's2+=1.5')

  // ── S3: Divider + stats + laser (6.5 – 10s) ──
  .add('s3', 6.5)
  .fromTo('#divider',
    { opacity: 1, scaleX: 0 },
    { scaleX: 1, duration: 0.7, ease: 'power2.inOut' },
  's3')
  .to('#stats', { opacity: 1, duration: 0.35 }, 's3+=0.65')
  .add(() => countUp(document.getElementById('stat-fps'), 60, 1.1), 's3+=0.72')
  .fromTo('#laser',
    { opacity: 0, y: 14 },
    { opacity: 1, y: 0, duration: 0.55 },
  's3+=1.3')
  // Laser sweep loop
  .to('#sweep', {
    translateX: '220%',
    duration: 0.7,
    ease: 'power2.inOut',
    repeat: -1,
    repeatDelay: 3.0,
  }, 's3+=1.9')

  // ── Hold at peak (10.5 – 17s) ──

  // ── S4: End card (17 – 22s) ──
  .add('s4', 17)
  .to(['#stamp','#prod-tag','#card','#glow'], {
    opacity: 0,
    duration: 0.7,
    ease: 'power2.in',
  }, 's4')
  .to('#end',   { opacity: 1, duration: 0.4, ease: 'none' }, 's4+=0.55')
  .fromTo('#end-rule',
    { scaleX: 0 },
    { scaleX: 1, duration: 0.65, ease: 'power2.inOut' },
  's4+=0.85')
  .to('#end', { opacity: 0, duration: 0.5, ease: 'power2.in' }, 's4+=3.8');
</script>
</body>
</html>
