<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050508; }

@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=JetBrains+Mono&display=swap');

canvas { position: absolute; top: 0; left: 0; }

#mascot-container {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.6));
  z-index: 10;
}

#mascot-container svg { width: 220px; height: auto; }

.text-overlay {
  position: absolute;
  font-family: 'Space Mono', monospace;
  color: #00ff88;
  opacity: 0;
  text-align: center;
  z-index: 20;
  white-space: pre-line;
}

#tech-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 800px; height: 800px;
  z-index: 5;
}

.tech-label {
  position: absolute;
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: #00ff88;
  opacity: 0;
  text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  transform: translate(-50%, -50%);
}

#hero-text {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 30;
  opacity: 0;
}

#hero-text .line1 {
  font-family: 'Archivo Black', Impact, sans-serif;
  font-size: 52px;
  color: #ffffff;
  margin-bottom: 16px;
}

#hero-text .line2 {
  font-family: 'Archivo Black', Impact, sans-serif;
  font-size: 52px;
  color: #00ff88;
}

#hero-text .accent-line {
  width: 0;
  height: 4px;
  background: #00ff88;
  margin: 20px auto;
}

#hero-text .punchline {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  color: #666677;
  margin-top: 24px;
}

#signal-text {
  position: absolute;
  bottom: 80px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: #334433;
  opacity: 0;
  z-index: 15;
  letter-spacing: 3px;
}

/* Film grain */
.grain {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 100;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
</style>
</head>
<body>

</div>

<div id="tech-ring"></div>

<div id="hero-text">
  <div class="line1">IF A BROWSER CAN RENDER IT</div>
  <div class="line2">KINO CAN RECORD IT.</div>
  <div class="accent-line"></div>
  <div class="punchline">7 frameworks. one renderer. zero lock-in.</div>
</div>

<div id="signal-text">PYTHON · JAVASCRIPT · HTML · CSS · GLSL · SVG</div>

<div class="grain"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = 1920;
canvas.height = 1080;

// ─── PARTICLE SYSTEM ───
const particles = [];
const NUM_PARTICLES = 80;
const cx = 960, cy = 540;

for (let i = 0; i < NUM_PARTICLES; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 600 + Math.random() * 800;
  particles.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    targetX: cx + (Math.random() - 0.5) * 200,
    targetY: cy + (Math.random() - 0.5) * 200,
    orbitAngle: angle,
    orbitRadius: 80 + Math.random() * 250,
    orbitSpeed: 0.3 + Math.random() * 0.5,
    size: 1 + Math.random() * 3,
    alpha: 0,
    phase: 'drift', // drift → converge → orbit → scatter
    color: Math.random() > 0.3 ? '#00ff88' : (Math.random() > 0.5 ? '#4ADE80' : '#22C55E'),
    speed: 0.5 + Math.random() * 1.5,
    scatterVx: 0,
    scatterVy: 0,
  });
}

// Stars (background)
const stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({
    x: Math.random() * 1920,
    y: Math.random() * 1080,
    size: 0.5 + Math.random() * 1.5,
    twinkleSpeed: 0.5 + Math.random() * 2,
    twinkleOffset: Math.random() * Math.PI * 2,
  });
}

let currentTime = 0;

function drawParticles(t) {
  ctx.clearRect(0, 0, 1920, 1080);

  // Stars
  const starAlpha = t < 1 ? t : (t > 28 ? Math.max(0, 1 - (t - 28) / 2) : 1);
  for (const s of stars) {
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * s.twinkleSpeed + s.twinkleOffset));
    ctx.fillStyle = `rgba(134, 239, 172, ${twinkle * 0.4 * starAlpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  for (const p of particles) {
    // Phase transitions based on time
    if (t < 3) {
      // Phase: drift inward slowly
      p.phase = 'drift';
      const progress = t / 3;
      p.alpha = Math.min(1, progress * 2) * 0.7;
      const ease = 1 - Math.pow(1 - progress, 3);
      p.x += (p.targetX - p.x) * 0.008;
      p.y += (p.targetY - p.y) * 0.008;
    } else if (t < 6) {
      // Phase: accelerate convergence to center
      p.phase = 'converge';
      p.alpha = 0.8;
      const pull = 0.03 + (t - 3) / 3 * 0.05;
      p.x += (cx - p.x) * pull;
      p.y += (cy - p.y) * pull;
      // Glow intensifies near center
      const dist = Math.hypot(p.x - cx, p.y - cy);
      if (dist < 100) p.alpha = 1;
    } else if (t < 10) {
      // Phase: portal flash + scatter to orbit
      if (p.phase !== 'orbit') {
        p.phase = 'orbit';
        p.orbitAngle = Math.atan2(p.y - cy, p.x - cx);
      }
      p.alpha = 0.6;
      p.orbitAngle += p.orbitSpeed * 0.02;
      const targetX = cx + Math.cos(p.orbitAngle) * p.orbitRadius;
      const targetY = cy + Math.sin(p.orbitAngle) * p.orbitRadius;
      p.x += (targetX - p.x) * 0.05;
      p.y += (targetY - p.y) * 0.05;
    } else if (t < 22) {
      // Phase: gentle orbit around mascot
      p.phase = 'orbit';
      p.alpha = 0.4 + 0.2 * Math.sin(t * 0.5);
      p.orbitAngle += p.orbitSpeed * 0.015;
      p.x = cx + Math.cos(p.orbitAngle) * p.orbitRadius;
      p.y = cy + Math.sin(p.orbitAngle) * p.orbitRadius;
    } else if (t < 26) {
      // Phase: pull back to center for hero text
      p.alpha = Math.max(0, 0.4 - (t - 22) * 0.1);
      p.x += (cx - p.x) * 0.02;
      p.y += (cy - p.y) * 0.02;
    } else {
      // Phase: scatter outward + fade
      if (p.phase !== 'scatter') {
        p.phase = 'scatter';
        const angle = Math.atan2(p.y - cy, p.x - cx);
        p.scatterVx = Math.cos(angle) * (2 + Math.random() * 4);
        p.scatterVy = Math.sin(angle) * (2 + Math.random() * 4);
      }
      p.x += p.scatterVx;
      p.y += p.scatterVy;
      p.alpha = Math.max(0, p.alpha - 0.015);
    }

    if (p.alpha > 0.01) {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      // Subtle glow (lightweight)
      if (p.size > 2 && (p.phase === 'converge' || p.phase === 'orbit')) {
        ctx.globalAlpha = p.alpha * 0.1;
        ctx.fillRect(p.x - p.size * 2, p.y - p.size * 2, p.size * 4, p.size * 4);
      }
    }
  }

  // Portal glow at center (3-8s)
  if (t > 3 && t < 8) {
    const intensity = t < 5.5 ? (t - 3) / 2.5 : Math.max(0, 1 - (t - 5.5) / 2.5);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 200);
    grad.addColorStop(0, `rgba(0, 255, 136, ${0.3 * intensity})`);
    grad.addColorStop(0.5, `rgba(34, 197, 94, ${0.1 * intensity})`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.fillRect(cx - 200, cy - 200, 400, 400);
  }

  ctx.globalAlpha = 1;
}

// ─── GSAP TIMELINE ───
const tl = gsap.timeline({ paused: true });

// 0-6s: particles drift + converge (handled in drawParticles)

// 6-10s: Mascot materializes
tl.to('#mascot-container', {
  scale: 1, opacity: 1, duration: 2, ease: 'back.out(1.5)',
}, 6);

// Mascot gentle float
tl.to('#mascot-container', {
  y: -10, duration: 2, yoyo: true, repeat: -1, ease: 'sine.inOut',
}, 7);

// 10-14s: Tech labels orbit in
const techs = ['GSAP', 'THREE.JS', 'CANVAS', 'WEBGL', 'PYTHON', 'SVG', 'HTML/CSS'];
const ring = document.getElementById('tech-ring');

techs.forEach((tech, i) => {
  const label = document.createElement('div');
  label.className = 'tech-label';
  label.textContent = tech;
  const angle = (i / techs.length) * Math.PI * 2 - Math.PI / 2;
  const radius = 320;
  label.style.left = (400 + Math.cos(angle) * radius) + 'px';
  label.style.top = (400 + Math.sin(angle) * radius) + 'px';
  ring.appendChild(label);

  tl.to(label, {
    opacity: 1, duration: 0.4, ease: 'power2.out',
  }, 10 + i * 0.3);
});

// Rotate the ring slowly
tl.to('#tech-ring', {
  rotation: 360, duration: 20, ease: 'none', repeat: -1,
}, 10);

// 18-22s: Labels fade, hero text approaches
tl.to('.tech-label', {
  opacity: 0, duration: 1, stagger: 0.1,
}, 20);

tl.to('#mascot-container', {
  scale: 0.6, y: -200, duration: 2, ease: 'power2.inOut',
}, 21);

// 22-27s: Hero text
tl.to('#hero-text', {
  opacity: 1, duration: 1, ease: 'power2.out',
}, 22);

tl.fromTo('#hero-text .line1', { y: 30 }, {
  y: 0, duration: 0.8, ease: 'power3.out',
}, 22);

tl.fromTo('#hero-text .line2', { y: 30 }, {
  y: 0, duration: 0.8, ease: 'power3.out',
}, 22.5);

tl.to('#hero-text .accent-line', {
  width: 500, duration: 1.2, ease: 'power2.out',
}, 23);

tl.to('#hero-text .punchline', {
  opacity: 1, duration: 0.8,
}, 24);

// Signal text
tl.to('#signal-text', {
  opacity: 0.5, duration: 1,
}, 25);

// 27-30s: Fade everything
tl.to('#mascot-container', {
  opacity: 0, scale: 0.3, duration: 2,
}, 27);

tl.to('#hero-text', {
  opacity: 0, duration: 1.5,
}, 28);

tl.to('#signal-text', {
  opacity: 0, duration: 1,
}, 28.5);

// ─── ANIMATION LOOP (kino time-virtualized) ───
function update() {
  const t = window.__kino ? window.__kino.currentTime : performance.now() / 1000;
  currentTime = t;
  tl.time(t);
  drawParticles(t);
  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
