<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

canvas#stars { position: absolute; top: 0; left: 0; z-index: 0; }

.card {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px; z-index: 5; opacity: 0;
}

#mascot-wrap {
  width: 180px;
  filter: drop-shadow(0 0 24px rgba(34,197,94,0.55)) drop-shadow(0 0 60px rgba(34,197,94,0.2));
  transform: translateY(20px);
  opacity: 0;
}

#brand-line {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  opacity: 0; transform: translateY(16px);
}

.brand-name {
  font-family: 'Archivo Black', 'Arial Black', sans-serif;
  font-size: 96px;
  color: #ffffff;
  letter-spacing: -0.04em;
  line-height: 1;
}

.brand-sub {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  color: #22C55E;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

.brand-rule {
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(34,197,94,0.6), transparent);
  margin: 4px 0;
}
</style>
</head>
<body>

<canvas id="stars" width="1920" height="1080"></canvas>

<div class="card" id="card">
  <div id="mascot-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" shape-rendering="crispEdges" width="180" height="229">
      <defs>
        <filter id="tg" x="-100%" y="-100%" width="400%" height="400%"><feGaussianBlur stdDeviation="8"/></filter>
        <filter id="bg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
      </defs>
      <circle cx="220" cy="300" r="145" fill="#22C55E" opacity="0.08" filter="url(#bg)"/>
      <circle cx="132" cy="24" r="16" fill="#A7F3D0" opacity="0.5" filter="url(#tg)"/>
      <rect x="120" y="20" width="20" height="20" fill="#DCFCE7"/>
      <rect x="140" y="40" width="20" height="20" fill="#22C55E"/><rect x="140" y="60" width="20" height="20" fill="#22C55E"/>
      <circle cx="308" cy="24" r="16" fill="#A7F3D0" opacity="0.5" filter="url(#tg)"/>
      <rect x="300" y="20" width="20" height="20" fill="#DCFCE7"/>
      <rect x="280" y="40" width="20" height="20" fill="#22C55E"/><rect x="280" y="60" width="20" height="20" fill="#22C55E"/>
      <rect x="180" y="80" width="40" height="20" fill="#4ADE80"/><rect x="220" y="80" width="40" height="20" fill="#22C55E"/>
      <rect x="140" y="100" width="40" height="20" fill="#4ADE80"/><rect x="180" y="100" width="80" height="20" fill="#22C55E"/><rect x="260" y="100" width="40" height="20" fill="#16A34A"/>
      <rect x="100" y="120" width="40" height="20" fill="#4ADE80"/><rect x="140" y="120" width="160" height="20" fill="#22C55E"/><rect x="300" y="120" width="40" height="20" fill="#16A34A"/><rect x="140" y="120" width="20" height="20" fill="#16A34A"/><rect x="280" y="120" width="20" height="20" fill="#16A34A"/>
      <rect x="80" y="140" width="280" height="20" fill="#22C55E"/><rect x="80" y="140" width="60" height="20" fill="#4ADE80"/><rect x="320" y="140" width="40" height="20" fill="#16A34A"/><rect x="120" y="140" width="20" height="20" fill="#16A34A"/><rect x="160" y="140" width="20" height="20" fill="#16A34A"/><rect x="260" y="140" width="20" height="20" fill="#16A34A"/><rect x="300" y="140" width="20" height="20" fill="#16A34A"/>
      <rect x="80" y="160" width="280" height="20" fill="#22C55E"/><rect x="80" y="160" width="40" height="20" fill="#4ADE80"/><rect x="320" y="160" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="180" width="280" height="20" fill="#22C55E"/><rect x="80" y="180" width="40" height="20" fill="#4ADE80"/><rect x="120" y="180" width="60" height="20" fill="#F0FFF4"/><rect x="160" y="180" width="20" height="20" fill="#FFFFFF"/><rect x="260" y="180" width="60" height="20" fill="#F0FFF4"/><rect x="300" y="180" width="20" height="20" fill="#FFFFFF"/><rect x="320" y="180" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="200" width="280" height="20" fill="#22C55E"/><rect x="80" y="200" width="40" height="20" fill="#4ADE80"/><rect x="120" y="200" width="20" height="20" fill="#F0FFF4"/><rect x="140" y="200" width="20" height="20" fill="#F0FFF4"/><rect x="160" y="200" width="20" height="20" fill="#111111"/><rect x="260" y="200" width="20" height="20" fill="#F0FFF4"/><rect x="280" y="200" width="20" height="20" fill="#F0FFF4"/><rect x="300" y="200" width="20" height="20" fill="#111111"/><rect x="320" y="200" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="220" width="280" height="20" fill="#22C55E"/><rect x="80" y="220" width="40" height="20" fill="#4ADE80"/><rect x="120" y="220" width="20" height="20" fill="#4ADE80"/><rect x="280" y="220" width="20" height="20" fill="#4ADE80"/><rect x="320" y="220" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="240" width="280" height="20" fill="#22C55E"/><rect x="80" y="240" width="40" height="20" fill="#4ADE80"/><rect x="320" y="240" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="260" width="280" height="20" fill="#22C55E"/><rect x="80" y="260" width="40" height="20" fill="#4ADE80"/><rect x="180" y="260" width="80" height="20" fill="#15803D"/><rect x="320" y="260" width="40" height="20" fill="#16A34A"/>
      <rect x="80" y="280" width="280" height="20" fill="#22C55E"/><rect x="80" y="280" width="40" height="20" fill="#4ADE80"/><rect x="320" y="280" width="40" height="20" fill="#16A34A"/>
      <rect x="100" y="300" width="240" height="20" fill="#22C55E"/><rect x="100" y="300" width="40" height="20" fill="#4ADE80"/><rect x="300" y="300" width="40" height="20" fill="#16A34A"/>
      <rect x="140" y="320" width="160" height="20" fill="#22C55E"/><rect x="140" y="320" width="40" height="20" fill="#16A34A"/><rect x="260" y="320" width="40" height="20" fill="#16A34A"/>
      <rect x="180" y="340" width="80" height="20" fill="#22C55E"/>
      <rect x="20" y="360" width="20" height="20" fill="#15803D"/><rect x="40" y="360" width="60" height="20" fill="#22C55E"/><rect x="100" y="360" width="240" height="20" fill="#22C55E"/><rect x="100" y="360" width="40" height="20" fill="#4ADE80"/><rect x="300" y="360" width="40" height="20" fill="#16A34A"/><rect x="340" y="360" width="60" height="20" fill="#22C55E"/><rect x="400" y="360" width="20" height="20" fill="#15803D"/>
      <rect x="40" y="380" width="20" height="20" fill="#15803D"/><rect x="80" y="380" width="20" height="20" fill="#15803D"/><rect x="100" y="380" width="240" height="20" fill="#22C55E"/><rect x="340" y="380" width="20" height="20" fill="#15803D"/><rect x="380" y="380" width="20" height="20" fill="#15803D"/>
      <rect x="100" y="400" width="240" height="20" fill="#22C55E"/><rect x="300" y="400" width="40" height="20" fill="#16A34A"/>
      <rect x="100" y="420" width="240" height="20" fill="#22C55E"/><rect x="280" y="420" width="60" height="20" fill="#16A34A"/>

      <rect x="32" y="258" width="10" height="10" fill="#86EFAC" opacity="0.7"/><rect x="22" y="268" width="10" height="10" fill="#86EFAC" opacity="0.7"/><rect x="32" y="268" width="10" height="10" fill="#86EFAC" opacity="0.7"/><rect x="42" y="268" width="10" height="10" fill="#86EFAC" opacity="0.7"/><rect x="32" y="278" width="10" height="10" fill="#86EFAC" opacity="0.7"/>
      <rect x="406" y="148" width="10" height="10" fill="#86EFAC" opacity="0.6"/><rect x="396" y="158" width="10" height="10" fill="#86EFAC" opacity="0.6"/><rect x="406" y="158" width="10" height="10" fill="#86EFAC" opacity="0.6"/><rect x="416" y="158" width="10" height="10" fill="#86EFAC" opacity="0.6"/><rect x="406" y="168" width="10" height="10" fill="#86EFAC" opacity="0.6"/>
    </svg>
  </div>
  <div id="brand-line">
    <div class="brand-rule" id="rule-left"></div>
    <div class="brand-name">kino</div>
    <div class="brand-rule" id="rule-right"></div>
    <div class="brand-sub">an infinitx production</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
  'use strict';

  // Star field
  const starsC = document.getElementById('stars').getContext('2d');
  const STARS = Array.from({ length: 180 }, () => ({
    x: Math.random() * 1920, y: Math.random() * 1080,
    r: Math.random() < 0.06 ? 2 : Math.random() < 0.2 ? 1.2 : 0.6,
    phase: Math.random() * Math.PI * 2,
    speed: 0.4 + Math.random() * 0.7
  }));

  function drawStars() {
    const t = performance.now() / 1000;
    starsC.clearRect(0, 0, 1920, 1080);
    STARS.forEach(s => {
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * s.speed + s.phase));
      starsC.globalAlpha = tw * 0.7;
      starsC.fillStyle = '#fff';
      starsC.beginPath(); starsC.arc(s.x, s.y, s.r, 0, Math.PI * 2); starsC.fill();
    });
    starsC.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // Timeline
  const tl = gsap.timeline();

  // Card fades in
  tl.to('#card', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);

  // Mascot drops in from above with spring
  tl.to('#mascot-wrap', { y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.5)' }, 0.3);

  // Brand line rises up
  tl.to('#brand-line', { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.6);

  // Rules expand outward
  tl.to('#rule-left, #rule-right', { width: 280, duration: 0.5, ease: 'power3.out' }, 0.8);

  // Mascot gentle float
  tl.to('#mascot-wrap', { y: -8, duration: 0.9, ease: 'sine.inOut', repeat: 3, yoyo: true }, 1.0);

})();
</script>
</body>
</html>
